[project]
name = "repstack-backend"
version = "0.1.0"
description = "Multi-tenant gym management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Our app's SQLAlchemy engine/pool is a module-level singleton created once at
# import time; pytest-asyncio's default per-function event loop would rebind it
# across different loops on every test and break on Windows. One loop, session-wide.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
