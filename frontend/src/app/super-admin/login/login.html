<div class="flex min-h-screen items-center justify-center bg-muted/30 p-4">
  <div class="w-full max-w-sm rounded-xl border bg-card p-8 shadow-lg">
    <div class="mb-6 text-center">
      <span class="text-2xl font-bold tracking-tight text-primary">RepStack</span>
      <p class="mt-1 text-sm text-muted-foreground">Super admin sign in</p>
    </div>

    <form class="flex flex-col gap-4" (submit)="login($event)">
      <div hlmField>
        <label hlmFieldLabel for="email">Email</label>
        <hlm-input-group>
          <hlm-input-group-addon>
            <ng-icon name="lucideMail" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            id="email"
            type="email"
            placeholder="super@repstack.dev"
            autocomplete="email"
            [formField]="credentialsForm.email"
          />
        </hlm-input-group>
      </div>

      <div hlmField>
        <label hlmFieldLabel for="password">Password</label>
        <hlm-input-group>
          <hlm-input-group-addon>
            <ng-icon name="lucideLock" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [formField]="credentialsForm.password"
          />
        </hlm-input-group>
      </div>

      @if (errorMessage()) {
        <p class="text-destructive text-sm">{{ errorMessage() }}</p>
      }

      <button hlmBtn type="submit" class="mt-2 w-full" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
