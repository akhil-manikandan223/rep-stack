<header class="flex h-12 w-full items-center gap-4 bg-primary px-4 text-primary-foreground shadow-sm">
  <!-- Hamburger -->
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    aria-label="Toggle sidebar"
    (click)="layoutState.toggleSidebar()"
  >
    <ng-icon name="lucideMenu" />
  </button>

  <!-- Brand -->
  <span class="text-lg font-semibold tracking-tight">RepStack Admin</span>

  <!-- Profile -->
  <div class="ms-auto flex items-center gap-2">
    <hlm-avatar class="size-8">
      <span hlmAvatarFallback>{{ (authService.currentUser()?.email ?? '?').charAt(0).toUpperCase() }}</span>
    </hlm-avatar>
    <span class="text-sm font-medium">{{ authService.currentUser()?.email }}</span>
    <button hlmBtn variant="ghost" size="icon" aria-label="Log out" (click)="logout()">
      <ng-icon name="lucideLogOut" />
    </button>
  </div>
</header>
