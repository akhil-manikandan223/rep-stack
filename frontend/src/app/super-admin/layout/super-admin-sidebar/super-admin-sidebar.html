<!-- Backdrop (visible over content, on any screen size, when sidebar is open) -->
@if (layoutState.sidebarOpen()) {
<div class="fixed inset-x-0 top-12 bottom-0 z-40 bg-black/50" (click)="layoutState.toggleSidebar()"></div>
}

<aside
    class="fixed top-12 bottom-0 left-0 z-50 flex w-64 flex-col overflow-x-hidden border-r bg-background shadow-lg transition-transform duration-200"
    [class.-translate-x-full]="!layoutState.sidebarOpen()" [class.translate-x-0]="layoutState.sidebarOpen()">
    <nav class="flex flex-col gap-1 p-2">
        @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="bg-accent text-accent-foreground"
            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground"
            (click)="layoutState.closeSidebar()">
            <ng-icon [name]="item.icon" size="18" />
            {{ item.label }}
        </a>
        }
    </nav>
</aside>
