<header class="flex h-12 w-full items-center gap-4 bg-primary px-4 text-primary-foreground shadow-sm">
  <!-- Hamburger -->
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    aria-label="Toggle sidebar"
    (click)="layoutState.toggleSidebar()"
  >
    <ng-icon name="lucideMenu" />
  </button>

  <!-- Brand -->
  <span class="text-lg font-semibold tracking-tight">RepStack</span>

  <!-- Search bar -->
  <hlm-input-group class="mx-auto max-w-md flex-1">
    <input hlmInputGroupInput placeholder="Search..." class="placeholder:text-white" />
    <hlm-input-group-addon class="text-white">
      <ng-icon name="lucideSearch" />
    </hlm-input-group-addon>
  </hlm-input-group>

  <!-- Profile -->
  <div class="flex items-center gap-2">
    <hlm-avatar class="size-8">
      <span hlmAvatarFallback>{{ (authService.currentUser()?.email ?? '?').charAt(0).toUpperCase() }}</span>
    </hlm-avatar>
    <span class="text-sm font-medium">{{ authService.currentUser()?.email }}</span>
    <button hlmBtn variant="ghost" size="icon" aria-label="Log out" (click)="logout()">
      <ng-icon name="lucideLogOut" />
    </button>
  </div>
</header>
